<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .head { transform-origin: 100px 90px; animation: bob 2.4s ease-in-out infinite; }
    .eye  { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    .pawL { transform-box: fill-box; transform-origin: center; animation: tap .5s ease-in-out infinite; }
    .pawR { transform-box: fill-box; transform-origin: center; animation: tap .5s ease-in-out .25s infinite; }
    .l1 { animation: type 3s steps(12) infinite; } .l2 { animation: type 3s steps(12) .6s infinite; } .l3 { animation: type 3s steps(12) 1.2s infinite; }
    .cursor { animation: cur 1s steps(2) infinite; }
    @keyframes bob { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes tap { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes type { 0% { width: 0; } 70%,100% { width: 60px; } }
    @keyframes cur { 0% { opacity: 1; } 100% { opacity: 0; } }
  </style>
  <ellipse cx="100" cy="190" rx="75" ry="6" fill="#000" opacity=".2"/>
  <g class="head">
    <polygon points="72,62 76,28 96,50" fill="#FF9A5C" stroke="#C2410C" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="128,62 124,28 104,50" fill="#FF9A5C" stroke="#C2410C" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="100" cy="76" r="34" fill="#FF9A5C" stroke="#C2410C" stroke-width="3"/>
    <ellipse class="eye" cx="88" cy="76" rx="4.5" ry="6.5" fill="#1f2937"/>
    <ellipse class="eye" cx="112" cy="76" rx="4.5" ry="6.5" fill="#1f2937"/>
    <polygon points="96,86 104,86 100,91" fill="#F472B6"/>
    <path d="M100 91 q-5 6 -10 2 M100 91 q5 6 10 2" fill="none" stroke="#7C2D12" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x="38" y="104" width="124" height="68" rx="7" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect class="l1" x="52" y="118" width="0" height="5" rx="2" fill="#FF7133"/>
  <rect class="l2" x="52" y="130" width="0" height="5" rx="2" fill="#61DAFB"/>
  <rect class="l3" x="52" y="142" width="0" height="5" rx="2" fill="#7CFC8A"/>
  <rect class="cursor" x="130" y="152" width="6" height="10" fill="#e2e8f0"/>
  <rect x="24" y="172" width="152" height="10" rx="5" fill="#64748b"/>
  <ellipse class="pawL" cx="80" cy="170" rx="11" ry="7" fill="#FFB98A" stroke="#C2410C" stroke-width="2"/>
  <ellipse class="pawR" cx="120" cy="170" rx="11" ry="7" fill="#FFB98A" stroke="#C2410C" stroke-width="2"/>
</svg>
