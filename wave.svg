<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .hand { transform-origin: 30px 46px; animation: wave 2.4s ease-in-out infinite; }
    @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10% { transform: rotate(16deg); } 20% { transform: rotate(-10deg); } 30% { transform: rotate(16deg); } 40% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }
  </style>
  <text class="hand" x="30" y="46" text-anchor="middle" font-size="44" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">👋</text>
</svg>
