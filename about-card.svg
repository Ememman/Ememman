  <text x="24" y="84" clip-path="url(#c0)" xml:space="preserve"><tspan fill="#ff7b72">const&#160;</tspan><tspan fill="#79c0ff">james&#160;</tspan><tspan fill="#e6edf3">=&#160;{</tspan></text>
