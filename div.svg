<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 6" width="800" height="6" preserveAspectRatio="none">
  <defs>
    <!-- Updated gradient to blend from black to your new blue/purple -->
    <linearGradient id="g">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3533cd"/>
      <stop offset="1" stop-color="#3533cd" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background track updated to match the new color scheme -->
  <rect x="0" y="2" width="800" height="2" rx="1" fill="#3533cd" opacity=".25"/>
  <!-- Animated bar -->
  <rect x="-250" y="1" width="250" height="4" rx="2" fill="url(#g)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1050 0" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
